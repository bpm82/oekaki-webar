<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>カードの作品 | おえかき立体工房</title>
    <link rel="stylesheet" href="../style.css?v=8" />
  </head>
  <body>
    <header class="bar viewer-bar">
      <a class="brand" href="../"
        ><span class="brand-mark" aria-hidden="true"></span>おえかき立体工房</a
      >
      <details id="reception-menu" class="reception-menu" hidden>
        <summary class="reception-toggle primary" aria-label="受付メニュー">
          <span aria-hidden="true"></span>
        </summary>
        <div class="reception-options">
          <button id="new-reception" type="button">新規受付</button>
        </div>
      </details>
    </header>
    <main class="wrap">
      <section class="viewer-panel">
        <p class="overline">作品カード <span id="number" class="number">—</span></p>
        <h1 id="title" tabindex="-1">作品を確認しています</h1>
        <p id="message" role="status"></p>
        <div id="media" class="viewer-media" hidden><img id="drawing" alt="送信した絵" hidden /></div>
        <div class="actions">
          <button id="play-waiting" type="button" class="primary" hidden>立体化を待ちながら遊ぶ</button>
          <button id="show-marker" type="button" class="primary" aria-haspopup="dialog" hidden>カードにかざす</button>
        </div>
        <noscript>作品を見るにはブラウザのJavaScriptを有効にしてください。</noscript>
      </section>
    </main>
    <dialog id="marker-dialog" class="marker-dialog" aria-labelledby="marker-title">
      <h2 id="marker-title">作品カード</h2>
      <p>スマホでQRを読み取ると、この作品を開けます。</p>
      <img id="card-marker" width="360" height="360" alt="黒い枠付きの作品カードのQRコード" />
      <form method="dialog">
        <button type="submit" autofocus>閉じる</button>
      </form>
    </dialog>
    <dialog id="wait-game-dialog" class="wait-game-dialog" aria-label="クリスマス工房">
      <form method="dialog" class="wait-game-toolbar">
        <button type="submit">作品ページに戻る</button>
      </form>
      <iframe id="wait-game-frame" title="クリスマス工房のミニゲーム"></iframe>
    </dialog>
    <script type="module" src="./viewer.js?v=4"></script>
  </body>
</html>
