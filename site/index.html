<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f1f5ef" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>おえかき立体工房</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span>おえかき立体工房</a>
      <nav aria-label="工房メニュー">
        <a href="cards/">カード印刷</a
        ><button type="button" id="setup" class="text-button">端末設定</button>
      </nav>
    </header>
    <main class="wrap">
      <section id="studio">
        <div class="intro">
          <h1>絵を描いて、<em>立体にしよう。</em></h1>
          <p>動物や好きなものを、ひとつ大きく描いてみてね。</p>
        </div>
        <div class="workbench">
          <div class="canvas-frame">
            <div class="paper">
              <canvas id="sheet" width="768" height="768" aria-label="お絵かきキャンバス"></canvas>
              <div id="hint" aria-hidden="true">ゆびやペンで描いてね</div>
            </div>
          </div>
          <fieldset id="tools" class="toolbox">
            <legend class="sr">お絵かき道具</legend>
            <div>
              <h2>色を選ぶ</h2>
              <div id="palette" class="palette" role="group" aria-label="ペンの色"></div>
            </div>
            <div>
              <label class="group-title" for="width">ペンの太さ</label>
              <div class="range-row">
                <span class="dot-small" aria-hidden="true"></span
                ><input type="range" id="width" min="3" max="65" value="17" /><span
                  class="dot-large"
                  aria-hidden="true"
                ></span>
              </div>
            </div>
            <div class="tool-grid">
              <button type="button" id="pen" aria-pressed="true">ペン</button
              ><button type="button" id="bucket" aria-pressed="false">ぬりつぶし</button
              ><button type="button" id="eraser" aria-pressed="false">消しゴム</button
              ><button type="button" id="undo" disabled>ひとつ戻す</button>
            </div>
            <div class="file-tools">
              <label class="file-label"
                >PNGを開く<input id="import" type="file" accept="image/png" /></label
              ><button id="download" type="button" class="text-button">PNGを保存</button>
            </div>
            <div class="finish">
              <button id="send" type="button" class="primary" disabled>完成！ 立体にする</button>
              <p>完成を押すと、絵と3D作品が公開されます。</p>
            </div>
          </fieldset>
        </div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </section>
      <section id="receipt" hidden class="receipt">
        <p class="overline">あなたのカード番号</p>
        <strong id="assigned" class="big-number"></strong>
        <h1>絵を受けつけました。</h1>
        <p>同じ番号のカードを受け取ってね。立体ができたら、カードのQRから見られます。</p>
        <div class="actions">
          <a id="view-link" class="button primary">作品を開く</a
          ><button id="next" class="button">次の絵を描く</button>
        </div>
      </section>
    </main>
    <dialog id="settings">
      <form id="settings-form">
        <h2>店頭端末の設定</h2>
        <p>スタッフが開始時に一度設定すると、このタブで「完成」から送信できます。</p>
        <label class="form-label" for="token">このリポジトリ専用のGitHubトークン</label>
        <input
          id="token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="github_pat_…"
          aria-describedby="token-help"
        />
        <p id="token-help" class="small">
          権限は Contents の「Read and write」。接続はこのタブを閉じると消えます。<a
            href="https://github.com/bpm82/oekaki-webar#店頭端末の準備"
            target="_blank"
            rel="noreferrer"
            >設定手順</a
          >
        </p>
        <label class="form-label" for="slot">次に使うカード</label
        ><select id="slot">
          <option value="">空いている番号を自動で使う</option>
        </select>
        <p id="connection" role="status" class="small"></p>
        <div class="actions">
          <button class="primary" type="submit">設定を保存</button
          ><button type="button" id="close">閉じる</button
          ><button class="text-button" type="button" id="disconnect" hidden>接続を解除</button>
        </div>
      </form>
    </dialog>
    <script src="studio.js?v=2" type="module"></script>
  </body>
</html>
