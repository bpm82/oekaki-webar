name: Drawings to 3D
on:
  push:
    branches: [main]
    paths: ['assets/*/drawing.png', 'assets/*/*.glb', 'assets/*/status.json', 'drawings/**', 'scripts/convert.py', 'scripts/slots.py', 'scripts/bake_colors.py', 'scripts/texture.py', 'scripts/check_baked_color.py', 'scripts/requirements-cpu.txt', '.github/workflows/convert.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-all-drawings
  cancel-in-progress: false

jobs:
  convert:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      WEIGHTS_REF: 5b521936b01fbe1890f6f9baed0254ab6351c04a
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONPATH: ${{ github.workspace }}/.engine
      RETRY: ${{ github.event_name == 'workflow_dispatch' && '--retry' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11'
      - name: Move legacy submissions into available numbered folders
        run: python scripts/slots.py
      - name: Find new or replaced PNG files
        id: scan
        run: python scripts/convert.py scan assets $RETRY
      - name: Cache the Blender release archive
        if: steps.scan.outputs.baking == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.3.2-linux-x64.tar.xz
          key: blender-4.3.2-linux-x64-4da1c956
      - name: Install CPU texture baker
        if: steps.scan.outputs.baking == 'true'
        run: |
          cd "$RUNNER_TEMP"
          archive=blender-4.3.2-linux-x64.tar.xz
          if [[ ! -s "$archive" ]]; then
            for mirror in https://mirror.blender.org https://mirror.clarkson.edu/blender https://ftp.halifax.rwth-aachen.de/blender; do
              if curl -fsSL --connect-timeout 10 --max-time 180 "$mirror/release/Blender4.3/$archive" -o "$archive"; then break; fi
            done
          fi
          echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $archive" | sha256sum --check
          tar -xf "$archive"
          echo "BLENDER_BIN=$RUNNER_TEMP/blender-4.3.2-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Install texture verification dependencies for existing models
        if: steps.scan.outputs.baking == 'true' && steps.scan.outputs.pending != 'true'
        run: python -m pip install numpy==1.26.4 Pillow==11.3.0
      - name: Check out TripoSR
        if: steps.scan.outputs.pending == 'true'
        uses: actions/checkout@v6
        with:
          repository: VAST-AI-Research/TripoSR
          ref: 107cefdc244c39106fa830359024f6a2f1c78871
          path: .engine
          persist-credentials: false
      - name: Restore CPU environment
        if: steps.scan.outputs.pending == 'true'
        id: packages
        uses: actions/cache@v4
        with:
          path: .venv
          key: cpu-ubuntu24-v1-${{ steps.python.outputs.python-version }}-${{ hashFiles('scripts/requirements-cpu.txt', '.github/workflows/convert.yml') }}
      - name: Restore model weights
        if: steps.scan.outputs.pending == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.u2net
          key: triposr-${{ env.WEIGHTS_REF }}-u2netp-v1
      - name: Install CPU-only dependencies
        if: steps.scan.outputs.pending == 'true' && steps.packages.outputs.cache-hit != 'true'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '1'
          CMAKE_ARGS: -DCMAKE_CUDA_COMPILER=NOTFOUND
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements-cpu.txt
          export CMAKE_PREFIX_PATH="$(python -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          python -m pip install --no-build-isolation 'git+https://github.com/tatsy/torchmcubes.git@3381600ddc3d2e4d74222f8495866be5fafbace4'
          python -m pip check
      - name: Reconstruct new drawings and bake GLB base color
        if: steps.scan.outputs.baking == 'true'
        run: |
          python_bin=python
          if [[ -x .venv/bin/python ]]; then python_bin=.venv/bin/python; fi
          "$python_bin" scripts/convert.py generate assets $RETRY
      - name: Mark any unfinished drawings for staff attention
        if: failure() && steps.scan.outputs.pending == 'true'
        run: python scripts/convert.py mark-failures assets
      - name: Save results beside the submitted drawings
        if: '!cancelled() && steps.scan.outcome == ''success'''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- assets/
          if [[ -n "$(git ls-files -- drawings/)" ]]; then git add --update -- drawings/; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save generated models in their numbered asset folders'
          gh auth setup-git
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
